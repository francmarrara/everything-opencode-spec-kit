name: Feature request
description: Suggest an idea (agent, skill, command, plugin, MCP)
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / Problema
      placeholder: What problem does this solve? / Quale problema risolve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal / Proposta
      placeholder: Agent, skill, command, plugin or MCP change?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - agents
        - commands
        - skills
        - plugins
        - mcp
        - specify-workflow
        - docs
        - other
    validations:
      required: false
